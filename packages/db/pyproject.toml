[project]
name = "riven-db"
version = "0.1.0"
description = "Shared SQLAlchemy models for every service's owned tables (migrated by apps/api/alembic)"
requires-python = ">=3.12"
dependencies = [
    "riven-schemas",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riven_db"]
