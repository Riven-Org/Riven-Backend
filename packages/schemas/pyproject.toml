[project]
name = "riven-schemas"
version = "0.1.0"
description = "Shared contracts and domain events used by every Riven service"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riven_schemas"]
