[project]
name = "riven-storage"
version = "0.1.0"
description = "Object storage for run logs and artifacts (MinIO locally, S3 in the cloud)"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riven_storage"]
