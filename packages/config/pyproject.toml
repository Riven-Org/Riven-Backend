[project]
name = "riven-config"
version = "0.1.0"
description = "Typed, fail-fast settings shared by every Riven service"
requires-python = ">=3.12"
dependencies = ["pydantic-settings>=2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riven_config"]
