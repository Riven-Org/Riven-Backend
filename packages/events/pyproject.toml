[project]
name = "riven-events"
version = "0.1.0"
description = "Domain event backbone: transactional outbox, Redis Streams relay, idempotent consumers"
requires-python = ">=3.12"
dependencies = [
    "riven-schemas",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riven_events"]
