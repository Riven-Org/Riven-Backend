[project]
name = "riven"
version = "0.1.0"
description = "Riven — independent verification and institutional memory for AI-built software"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["apps/api"]

[tool.uv.sources]
riven-api = { workspace = true }

[dependency-groups]
dev = [
    "riven-api",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["riven_api"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests"]
