name: Terraform

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: ["**"]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: tf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"

      - name: Check Formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate Modules
        run: |
          for dir in infra/terraform/modules/*; do
            if [ -d "$dir" ]; then
              echo "=== Initializing & validating $dir ==="
              (cd "$dir" && terraform init -backend=false && terraform validate)
            fi
          done

      - name: Validate Staging Environment
        run: |
          echo "=== Initializing & validating infra/terraform/environments/staging ==="
          (cd infra/terraform/environments/staging && terraform init -backend=false && terraform validate)

      - name: Summary
        run: |
          echo "### 🏗️ Terraform Static Validation" >> $GITHUB_STEP_SUMMARY
          echo "• Canonical formatting: \`terraform fmt -check\` passed" >> $GITHUB_STEP_SUMMARY
          echo "• All modules validated: \`remote_state\`, \`vpc\`, \`eks\`, \`data_stores\`" >> $GITHUB_STEP_SUMMARY
          echo "• Staging environment composition validated: \`infra/terraform/environments/staging\`" >> $GITHUB_STEP_SUMMARY

  plan:
    name: Staging Plan
    needs: validate
    runs-on: ubuntu-latest
    # Safe plan execution: runs plan if AWS credentials / OIDC role are configured in repo secrets.
    # Otherwise skipped safely with validation evidence reported.
    if: false # Activated once human admin provisions staging AWS account and sets AWS_ROLE_ARN secret
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform Init
        run: cd infra/terraform/environments/staging && terraform init

      - name: Terraform Plan
        id: plan
        run: |
          cd infra/terraform/environments/staging
          terraform plan -no-color -out=tfplan > plan_output.txt
          cat plan_output.txt >> $GITHUB_STEP_SUMMARY

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          echo "<!-- riven-terraform-plan -->" > plan_comment.md
          echo "### 🏗️ Terraform Staging Plan" >> plan_comment.md
          echo "\`\`\`hcl" >> plan_comment.md
          cat infra/terraform/environments/staging/plan_output.txt >> plan_comment.md
          echo "\`\`\`" >> plan_comment.md
          gh pr comment "${PR_NUMBER}" --body-file plan_comment.md
