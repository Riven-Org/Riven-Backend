[project]
name = "riven-worker"
version = "0.1.0"
description = "Riven Temporal worker: runs the verification pipeline"
requires-python = ">=3.12"
dependencies = [
    "riven-schemas",
    "temporalio>=1.7",
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riven_worker"]
