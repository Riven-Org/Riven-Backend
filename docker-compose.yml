# Full local stack (ticket S02.1). Start everything with `make dev`.
x-riven-env: &riven-env
  RIVEN_ENV: dev
  RIVEN_DATABASE_URL: postgresql+asyncpg://riven:riven@postgres:5432/riven
  RIVEN_REDIS_URL: redis://redis:6379/0
  RIVEN_TEMPORAL_ADDRESS: temporal:7233
  RIVEN_S3_ENDPOINT_URL: http://s3:8333
  RIVEN_S3_BUCKET: riven-artifacts
  RIVEN_S3_ACCESS_KEY: riven
  RIVEN_S3_SECRET_KEY: riven-dev-secret

x-riven-app: &riven-app
  build: .
  image: riven-backend:dev
  environment: *riven-env
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: riven
      POSTGRES_PASSWORD: riven
      POSTGRES_DB: riven
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riven -d riven"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  # S3-compatible object storage (SeaweedFS, Apache-2.0). Host port 9000 = S3 API.
  s3:
    image: chrislusf/seaweedfs:3.99
    command: server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=1024
    ports: ["9000:8333"]
    volumes: [s3data:/data]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333"]
      interval: 5s
      retries: 30

  # One-shot: create the artifacts bucket.
  storage-init:
    <<: *riven-app
    restart: "no"
    depends_on:
      s3:
        condition: service_healthy
    command: ["python", "-m", "riven_storage"]
    profiles: [init]

  # Temporal stores its own state in the same Postgres (separate databases).
  temporal:
    image: temporalio/auto-setup:1.24.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: riven
      POSTGRES_PWD: riven
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]
    healthcheck:
      test: ["CMD-SHELL", "tctl --address $$(hostname -i):7233 cluster health | grep -q SERVING"]
      interval: 5s
      retries: 40
      start_period: 20s

  temporal-ui:
    image: temporalio/ui:2.26.2
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ["8080:8080"]

  # One-shot: apply migrations (make dev runs it before the app services start).
  migrate:
    <<: *riven-app
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "-c", "apps/api/alembic.ini", "upgrade", "head"]
    profiles: [init]

  api:
    <<: *riven-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["8000:8000"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      interval: 5s
      retries: 20

  worker:
    <<: *riven-app
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["python", "-m", "riven_worker.main"]

  relay:
    <<: *riven-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "riven_events.relay"]

volumes:
  pgdata:
  redisdata:
  s3data:
